<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Adrogué</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1f24; color: #f2efe8;
        font: 16px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      #app, #app > canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      [hidden] { display: none !important; }

      .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(15, 18, 22, 0.55); }
      .panel { min-width: 18rem; max-width: min(36rem, 90vw); max-height: 85vh; overflow: auto; padding: 1.5rem 2rem;
        background: rgba(20, 24, 30, 0.88); border-radius: 12px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        display: flex; flex-direction: column; gap: 0.75rem; text-align: center; }
      .panel h1 { margin: 0; font-size: 3rem; letter-spacing: 0.02em; }
      .panel h2 { margin: 0 0 0.25rem; font-size: 1.4rem; }
      .panel p { margin: 0; }
      .help { opacity: 0.8; font-size: 0.9rem; }
      .panel button { font: inherit; color: inherit; cursor: pointer; padding: 0.55rem 1rem; border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.18); background: rgba(255, 255, 255, 0.08); }
      .panel button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.18); }
      .panel button:disabled { cursor: wait; opacity: 0.5; }
      .panel button.primary { background: #2f6fd1; border-color: #2f6fd1; font-weight: 600; font-size: 1.1rem; }
      .panel button.primary:hover:not(:disabled) { background: #3d7ee0; }
      .quality { display: flex; align-items: center; justify-content: center; gap: 0.35rem; }
      .quality button { padding: 0.3rem 0.7rem; }
      .quality button[aria-pressed='true'] { background: #f2efe8; color: #1b1f24; }
      .places { display: grid; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); gap: 0.4rem; text-align: left; }
      .places button { text-align: left; padding: 0.4rem 0.7rem; }
      .places button.random { grid-column: 1 / -1; text-align: center; font-weight: 600; }
      .credits { margin: 0; padding: 0; list-style: none; text-align: left; display: flex; flex-direction: column; gap: 0.6rem; }
      .credits a { color: #9cc3ff; }
      .credits small { display: block; opacity: 0.75; }
      .fatal p { font-size: 1.15rem; max-width: 30rem; }

      .crosshair { position: fixed; left: 50%; top: 50%; width: 14px; height: 14px; transform: translate(-50%, -50%);
        pointer-events: none; }
      .crosshair::before, .crosshair::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.8); }
      .crosshair::before { left: 6px; top: 0; width: 2px; height: 14px; }
      .crosshair::after { left: 0; top: 6px; width: 14px; height: 2px; }
      .stats { position: fixed; left: 8px; top: 8px; padding: 2px 8px; border-radius: 4px; pointer-events: none;
        background: rgba(0, 0, 0, 0.55); font: 13px/1.6 ui-monospace, Menlo, Consolas, monospace; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
